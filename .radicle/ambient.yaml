pre_plan:
  - action: npm_get
plan:
  - action: shell
    shell: |
      cd /ci/src
      # npm cache add accepts one package spec at a time. Run at most one
      # worker per CI vCPU so large lockfiles do not spend the whole job
      # launching hundreds of cache-population processes serially.
      find /ci/deps/npm -name '*.tgz' -type f -print0 \
        | xargs -0 -r -n 1 -P 3 npm cache add --cache /ci/cache/npm
      npm ci --offline --ignore-scripts --cache /ci/cache/npm
      npm run test:unit -- --runInBand
      npm run lint
