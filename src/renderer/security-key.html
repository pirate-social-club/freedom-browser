<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security key — Freedom</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/light-theme.css">
  <link rel="stylesheet" href="security-key.css">
  <link rel="stylesheet" href="styles/inputs.css">
</head>
<body>
  <main>
    <h1 id="title">Security key</h1>
    <p id="origin"></p>
    <p>Passkey site: <strong id="rp"></strong></p>
    <p id="message" role="status"></p>
    <form id="form">
      <div id="pin-fields" hidden>
        <label for="pin">Security key PIN</label>
        <input id="pin" type="password" autocomplete="off" spellcheck="false" maxlength="256">
        <p>After continuing, touch your key if its light flashes.</p>
      </div>
      <div id="account-fields" hidden>
        <label for="account">Choose a passkey</label>
        <select id="account"></select>
      </div>
      <div class="actions"><button id="cancel" type="button">Cancel</button><button type="submit">Continue</button></div>
    </form>
  </main>
  <script src="security-key.js"></script>
</body>
</html>
