<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; object-src 'none'; form-action 'none';"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        box-sizing: border-box;
        padding: 40px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--shell-gradient);
        color: var(--shell-heading);
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 650;
      }

      p {
        margin: 0 0 24px;
        color: var(--shell-text);
        line-height: 1.5;
      }

      .card {
        background: var(--shell-surface);
        border: 1px solid var(--shell-border-soft);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(12px);
      }

      .status {
        display: inline-block;
        margin-bottom: 16px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--shell-link);
      }

      dl {
        margin: 0;
        display: grid;
        gap: 14px;
      }

      dt {
        margin: 0 0 4px;
        color: var(--shell-muted);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      dd {
        margin: 0;
        color: var(--shell-heading);
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      dd[data-variant='text'] {
        font-family: inherit;
      }

      .hint {
        margin-top: 20px;
        color: var(--shell-muted);
      }


    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title">Spaces Resolution</h1>
      <p id="description"></p>

      <div class="card">
        <div id="status" class="status"></div>
        <dl id="details"></dl>
        <p id="hint" class="hint"></p>
      </div>
    </div>

    <script src="scripts/space-browser.js"></script>
  </body>
</html>
