<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spaces Resolution</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #20242c, #111318 62%);
        color: #f2f4f7;
      }
      main { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      #description { margin: 0 0 24px; color: #c4cad4; line-height: 1.5; }
      .card {
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
      }
      #status {
        margin-bottom: 18px;
        color: #ffb45f;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      dl { display: grid; gap: 14px; margin: 0; }
      dt { margin-bottom: 4px; color: #8f9aaa; font-size: 12px; text-transform: uppercase; }
      dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
      dd.text { font-family: inherit; }
      #hint { margin: 20px 0 0; color: #8f9aaa; }
      @media (prefers-color-scheme: light) {
        body { background: radial-gradient(circle at top, #f7f8fb, #eef1f7 62%); color: #151823; }
        #description, #hint, dt { color: #5f6b7a; }
        .card { background: rgba(255, 255, 255, 0.9); border-color: rgba(17, 19, 24, 0.08); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Spaces Resolution</h1>
      <p id="description"></p>
      <section class="card" aria-live="polite">
        <div id="status"></div>
        <dl id="details"></dl>
        <p id="hint"></p>
      </section>
    </main>
    <script src="scripts/space-browser.js"></script>
  </body>
</html>
