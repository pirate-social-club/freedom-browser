name: Encrypted HNS native validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hns-encrypted-transport.yml
      - ops/hns-encrypted-transport/**
      - src/main/hns-*.js
      - assets/hns/hnsd-encrypted
      - test/helpers/hns-dns-fixtures.js
permissions:
  contents: read
concurrency:
  group: hns-encrypted-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-validation:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/upstream-0.8.6-spaces') ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 39 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/upstream-0.8.6-spaces')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
      - name: Prepare pinned native source and isolated build image
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -m 755 "$RUNNER_TEMP/hns-encrypted-input" "$RUNNER_TEMP/hns-encrypted-output"
          git -c core.hooksPath=/dev/null clone --branch v2.0.0 --depth 1 https://github.com/handshake-org/hnsd.git "$RUNNER_TEMP/hns-encrypted-source"
          test "$(git -C "$RUNNER_TEMP/hns-encrypted-source" rev-parse HEAD)" = a5c7c287e848f46d3e97f16b698e2027c8dc96c3
          git -C "$RUNNER_TEMP/hns-encrypted-source" archive HEAD > "$RUNNER_TEMP/hns-encrypted-input/hnsd-source.tar"
          test "$(sha256sum ops/hns-encrypted-transport/hnsd-encrypted.patch | cut -d ' ' -f 1)" = 1b9749f6275c0814ecea487072b979cd263ed84823fe8a3a2a48cc88e8752c96
          cp ops/hns-encrypted-transport/hnsd-encrypted.patch "$RUNNER_TEMP/hns-encrypted-input/"
          docker build --tag "hns-encrypted:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ops/hns-encrypted-transport
          docker image inspect "hns-encrypted:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/hns-encrypted-output/image.json"
          git rev-parse HEAD > "$RUNNER_TEMP/hns-encrypted-output/freedom-source.txt"
          test "$(sha256sum hns-bin/linux-x64/fingertipd | cut -d ' ' -f 1)" = 065e4f0d5c118213f09319998c94633033cae7f96dc6d714083208468225f766
          sha256sum hns-bin/linux-x64/fingertipd assets/hns/hnsd-encrypted ops/hns-encrypted-transport/native-validation.js > "$RUNNER_TEMP/hns-encrypted-output/fixture-inputs.sha256"
      - name: Compile native validator without network access
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$(id -u)" -gt 0
          docker run --name "hns-encrypted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --label "freedom.encrypted.run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --user "$(id -u):$(id -g)" --network none --cpus 1 --cpuset-cpus 0 \
            --memory 2g --memory-swap 2g --pids-limit 256 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/hns-encrypted-input:/input:ro" \
            -v "$RUNNER_TEMP/hns-encrypted-output:/output" \
            "hns-encrypted:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > "$RUNNER_TEMP/hns-encrypted-output/build.log" 2>&1
      - name: Validate on the target runtime in a loopback-only namespace
        timeout-minutes: 8
        env:
          FREEDOM_NATIVE_OUTPUT: ${{ runner.temp }}/hns-encrypted-output
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunbound8
          dpkg-query -W libunbound8 libc6 > "$FREEDOM_NATIVE_OUTPUT/runtime-packages.txt"
          ldd "$FREEDOM_NATIVE_OUTPUT/hnsd" > "$FREEDOM_NATIVE_OUTPUT/runtime-linkage.txt"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['FREEDOM_NATIVE_OUTPUT'])
          record={'schema':1,'source_commit':'a5c7c287e848f46d3e97f16b698e2027c8dc96c3','patch_sha256':hashlib.sha256((root/'hnsd-encrypted.patch').read_bytes()).hexdigest(),'sha256':hashlib.sha256((root/'hnsd').read_bytes()).hexdigest()}
          (root/'encrypted-validator.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          unit="freedom-hns-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          cleanup() { sudo systemctl stop "$unit"; }
          trap cleanup EXIT
          sudo systemd-run --unit="$unit" --slice=system.slice --wait --pipe \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            -p CPUQuota=100% -p CPUAffinity=0 -p Nice=19 -p MemoryMax=768M \
            -p MemorySwapMax=0 -p PrivateNetwork=yes -p NoNewPrivileges=yes \
            -p RuntimeMaxSec=360 -p TimeoutStopSec=5 -p KillMode=control-group \
            "$(command -v node)" ops/hns-encrypted-transport/native-validation.js \
            "$FREEDOM_NATIVE_OUTPUT/hnsd" "$FREEDOM_NATIVE_OUTPUT/native-fixtures" \
            > "$FREEDOM_NATIVE_OUTPUT/native-validation.log" 2>&1
      - name: Retain outcome and prove owned container and service cleanup
        if: always()
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hns-encrypted-output"
          unit="freedom-hns-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          timeout --kill-after=2s 15s sudo systemctl stop "$unit" && stop_code=0 || stop_code=$?
          systemctl show "$unit" -p ActiveState --value > "$RUNNER_TEMP/hns-encrypted-output/native-state.txt" && state_code=0 || state_code=$?
          if [ "$(cat "$RUNNER_TEMP/hns-encrypted-output/native-state.txt")" = failed ]; then
            timeout --kill-after=2s 10s sudo systemctl reset-failed "$unit" && reset_code=0 || reset_code=$?
          fi
          systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p Result -p MainPID -p ControlGroup > "$RUNNER_TEMP/hns-encrypted-output/native-unit-final.txt" && show_code=0 || show_code=$?
          printf 'stop=%s state_query=%s reset=%s final_query=%s\n' "$stop_code" "$state_code" "${reset_code:-not-needed}" "$show_code" > "$RUNNER_TEMP/hns-encrypted-output/unit-cleanup-exit-codes.txt"
          python3 ops/hns-encrypted-transport/cleanup.py && container_code=0 || container_code=$?
          python3 ops/hns-encrypted-transport/verify-native-cleanup.py "$unit" "$RUNNER_TEMP/hns-encrypted-output" "$stop_code" && unit_code=0 || unit_code=$?
          test "$container_code" -eq 0 && test "$unit_code" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: encrypted-hns-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hns-encrypted-output/
          if-no-files-found: error
          retention-days: 30
