name: Veritas Linux feasibility

on:
  pull_request:
    paths:
      - '.github/workflows/veritas-linux-feasibility.yml'
      - 'ops/veritas-linux-feasibility/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veritas-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Build pinned Linux core and retain diagnostics
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 ops/veritas-linux-feasibility/build.py
      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: veritas-linux-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veritas-feasibility/evidence/
          if-no-files-found: error
          retention-days: 14
