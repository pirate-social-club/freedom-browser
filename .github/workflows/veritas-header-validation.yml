name: Veritas header conformance

on:
  pull_request:
    paths:
      - '.github/workflows/veritas-header-validation.yml'
      - 'ops/veritas-header-validation/**'
      - 'ops/veritas-linux-feasibility/build.py'
      - 'ops/veritas-linux-feasibility/pins.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veritas-header-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Compile and test the defensive mainnet component
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 ops/veritas-header-validation/check.py
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: veritas-header-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veritas-header-validation/evidence/
          if-no-files-found: error
          retention-days: 14
