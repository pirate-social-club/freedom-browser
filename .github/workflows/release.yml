name: Release

# Manual multi-platform build qualification only. It builds every desktop
# target on dispatch and publishes nothing: no tag push starts it, it has no
# publish job, and its token can only read. A Linux evaluation release
# promotes the exact inspected deb from the "Linux evaluation deb" workflow
# instead (see the step 6 publication plan); rebuilding a tag release belongs
# to the later release-identity and signing work.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          path: freedom-browser

      - name: Check out sentinel-ai-connect dependency
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: Sentinel-Autonomybuilder/blue-ai-connect
          ref: 924d472cb8be47b11f2432515f23bd5ea20d297c
          path: blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency
        run: cp -R blue-ai-connect ../blue-ai-connect

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: freedom-browser/package-lock.json

      - name: Install dependencies
        working-directory: freedom-browser
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: freedom-browser
        run: npm audit --audit-level=high

      - name: Run lint
        working-directory: freedom-browser
        run: npm run lint

      - name: Run tests
        working-directory: freedom-browser
        run: npm run test:coverage

      - name: Verify platform capability matrix
        working-directory: freedom-browser
        run: npm run test:capabilities

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS x64
            binary_target: mac-x64
            ipfs_target: darwin-x64
            radicle_flags: --mac --x64
            artifact_name: macos-x64
            publish_on_tag: false
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --mac --x64
          - os: macos-14
            label: macOS arm64
            binary_target: mac-arm64
            ipfs_target: darwin-arm64
            radicle_flags: --mac --arm64
            artifact_name: macos-arm64
            publish_on_tag: false
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --mac --arm64
          - os: ubuntu-latest
            label: Linux x64
            binary_target: linux-x64
            ipfs_target: linux-x64
            radicle_flags: --linux --x64
            artifact_name: linux-x64
            publish_on_tag: true
            workdir: freedom-browser
            build_command: npm run dist:linux:x64:docker
          - os: windows-latest
            label: Windows x64
            binary_target: win-x64
            ipfs_target: win32-x64
            radicle_flags: --win --x64
            artifact_name: windows-x64
            publish_on_tag: false
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --win --x64

    steps:
      - name: Check out repository
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          path: freedom-browser

      - name: Check out sentinel-ai-connect dependency
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          repository: Sentinel-Autonomybuilder/blue-ai-connect
          ref: 924d472cb8be47b11f2432515f23bd5ea20d297c
          path: blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency
        if: runner.os != 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        shell: bash
        run: cp -R blue-ai-connect ../blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency (Windows)
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        shell: pwsh
        run: Copy-Item -Path blue-ai-connect -Destination .. -Recurse -Force

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: freedom-browser/package-lock.json

      - name: Cache Electron build downloads
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('freedom-browser/package-lock.json') }}

      - name: Install dependencies
        if: runner.os != 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: npm ci

      - name: Audit dependencies
        if: runner.os != 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: npm audit --audit-level=high

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: npm ci

      - name: Audit dependencies (Windows)
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Download platform binaries
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        working-directory: ${{ matrix.workdir }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run ant:download -- --target ${{ matrix.binary_target }}
          npm run ipfs:download -- --target ${{ matrix.ipfs_target }}
          npm run radicle:download -- ${{ matrix.radicle_flags }}

      - name: Build macOS release artifacts
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: ${{ matrix.build_command }} --unsigned --no-notarize

      - name: Build non-macOS release artifacts
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Build Windows release artifacts
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: ${{ matrix.build_command }}

      - name: Smoke packaged HNS HTTPS
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || matrix.publish_on_tag)
        working-directory: ${{ matrix.workdir }}
        shell: bash
        env:
          FREEDOM_HNS_SMOKE_EXTRA_HOST: ${{ secrets.FREEDOM_HNS_SMOKE_EXTRA_HOST }}
        run: npm run smoke:hns:packaged -- --resources-dir dist/linux-unpacked/resources

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch' || matrix.publish_on_tag
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.workdir }}/dist/*
          if-no-files-found: error
          retention-days: 30
