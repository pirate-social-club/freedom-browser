name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: freedom-browser

      - name: Check out sentinel-ai-connect dependency
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Sentinel-Autonomybuilder/blue-ai-connect
          ref: 924d472cb8be47b11f2432515f23bd5ea20d297c
          path: blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency
        run: cp -R blue-ai-connect ../blue-ai-connect

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freedom-browser/package-lock.json

      - name: Install dependencies
        working-directory: freedom-browser
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: freedom-browser
        run: npm audit --audit-level=high

      - name: Run lint
        working-directory: freedom-browser
        run: npm run lint

      - name: Run tests
        working-directory: freedom-browser
        run: npm run test:coverage

      - name: Verify platform capability matrix
        working-directory: freedom-browser
        run: npm run test:capabilities

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS x64
            artifact_name: macos-x64
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --mac --x64
          - os: macos-14
            label: macOS arm64
            artifact_name: macos-arm64
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --mac --arm64
          - os: ubuntu-latest
            label: Linux x64
            artifact_name: linux-x64
            workdir: freedom-browser
            build_command: npm run dist:linux:x64:docker
          - os: windows-latest
            label: Windows x64
            artifact_name: windows-x64
            workdir: freedom-browser
            build_command: node scripts/build.js --dist --win --x64

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: freedom-browser

      - name: Check out sentinel-ai-connect dependency
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Sentinel-Autonomybuilder/blue-ai-connect
          ref: 924d472cb8be47b11f2432515f23bd5ea20d297c
          path: blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency
        if: runner.os != 'Windows'
        shell: bash
        run: cp -R blue-ai-connect ../blue-ai-connect

      - name: Prepare sentinel-ai-connect file dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Path blue-ai-connect -Destination .. -Recurse -Force

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freedom-browser/package-lock.json

      - name: Install dependencies
        if: runner.os != 'Windows'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: npm ci

      - name: Audit dependencies
        if: runner.os != 'Windows'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: npm audit --audit-level=high

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: npm ci

      - name: Audit dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Download platform binaries
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          npm run bee:download
          npm run ipfs:download
          if [ "$RUNNER_OS" != "Windows" ]; then
            npm run radicle:download -- --all
          fi

      - name: Build macOS release artifacts
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_TEAM_ID}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ]; then
            echo "::error::macOS release signing and notarization credentials are required"
            exit 1
          fi
          ${{ matrix.build_command }}

      - name: Build non-macOS release artifacts
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.workdir }}
        shell: pwsh
        run: ${{ matrix.build_command }}

      - name: Smoke packaged HNS HTTPS
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.workdir }}
        shell: bash
        env:
          FREEDOM_HNS_SMOKE_EXTRA_HOST: ${{ secrets.FREEDOM_HNS_SMOKE_EXTRA_HOST }}
        run: npm run smoke:hns:packaged -- --resources-dir dist/linux-unpacked/resources

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.workdir }}/dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: pirate-social-club/freedom-browser
        run: |
          shopt -s nullglob
          tag="${GITHUB_REF#refs/tags/}"
          artifacts=(release-artifacts/*.dmg release-artifacts/*.zip release-artifacts/*.deb release-artifacts/*.AppImage release-artifacts/*.exe release-artifacts/*.blockmap release-artifacts/latest*.yml release-artifacts/SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" --generate-notes
          fi
