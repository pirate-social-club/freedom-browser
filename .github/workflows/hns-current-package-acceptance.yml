name: HNS current Linux package acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hns-current-package-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: freedom-browser
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Sentinel-Autonomybuilder/blue-ai-connect
          ref: 924d472cb8be47b11f2432515f23bd5ea20d297c
          path: blue-ai-connect
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.0
      - name: Cold dependencies and pinned diagnostic tools
        timeout-minutes: 20
        env:
          FREEDOM_REPOSITORY: ${{ github.workspace }}/freedom-browser
          FREEDOM_SOURCE_SHA: ${{ github.sha }}
          FREEDOM_COLD_ROOT: ${{ runner.temp }}/freedom-package-cold
        run: |
          set -euo pipefail
          cp -R blue-ai-connect ../blue-ai-connect
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb slirp4netns nftables python3-venv binutils
          timeout --signal=TERM --kill-after=5s 1155s python3 freedom-browser/ops/hns-package-acceptance/cold-setup.py
      - name: One contained current-package acceptance
        timeout-minutes: 11
        env:
          FREEDOM_REPOSITORY: ${{ github.workspace }}/freedom-browser
          FREEDOM_SOURCE_SHA: ${{ github.sha }}
          FREEDOM_PYTHON_PREFIX: ${{ runner.temp }}/freedom-package-cold/python
          FREEDOM_BROWSER_PREFIX: ${{ runner.temp }}/freedom-package-cold/browser
          FREEDOM_HOSTED_PRIVATE: ${{ runner.temp }}/freedom-package-private
          FREEDOM_HOSTED_PUBLIC: ${{ runner.temp }}/freedom-package-public
        run: |
          set -euo pipefail
          mkdir -m 700 "$FREEDOM_HOSTED_PRIVATE"
          mkdir -m 755 "$FREEDOM_HOSTED_PUBLIC"
          cp "${RUNNER_TEMP}/freedom-package-cold/cold-setup.json" "$FREEDOM_HOSTED_PUBLIC/cold-setup.json"
          sudo --preserve-env=PATH,FREEDOM_REPOSITORY,FREEDOM_SOURCE_SHA,FREEDOM_PYTHON_PREFIX,FREEDOM_BROWSER_PREFIX,FREEDOM_HOSTED_PRIVATE,FREEDOM_HOSTED_PUBLIC python3 freedom-browser/ops/hns-package-acceptance/launch.py
      - name: Upload only explicitly sanitized receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-linux-package-public-receipts-${{ github.sha }}
          path: ${{ runner.temp }}/freedom-package-public/
          if-no-files-found: warn
          retention-days: 7
